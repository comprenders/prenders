name: build

# Builds of the app from its source repository, by hand only. This repository holds this file
# and the releases; it holds no app code. The source is read with a read-only deploy key
# (secret SOURCE_DEPLOY_KEY) from the repository named in the secret SOURCE_REPO.
#
# One run makes ONE draft prerelease named `dev-<short sha>`, with the files of every target
# of the run, as a release page lists all the platforms. The job `resolve` creates the draft
# once (`scripts/attach-dev-build.sh create` of the source); each build job then only
# uploads into it (`attach-dev-build.sh upload`), so the parallel jobs do not race to create
# it. A later run for the same commit, also with one target, uploads into the same draft. A
# draft has no git tag, and nothing is published. The name never starts with `v`.
#
# The source commit must have the `create`/`upload` form of `scripts/attach-dev-build.sh`
# (2026-10-08) and `scripts/build-identity.mjs` (plan-r3 K2). For an older commit, `resolve`
# fails.
#
# No file of the source holds the version (plan-r3 7.1). `resolve` makes the build identity
# of the commit, a dev build after the last release tag (`scripts/build-identity.mjs
# --print`). Each job that builds or tests writes it to `build-identity.json` of its
# checkout (`--from`), which also checks that the checkout is the commit of the identity.
#
# With the target x86_64-pc-windows-msvc or all, the run also tests on Windows: the backend
# suite (`backend-windows`) and the units of the shipped server (`smoke-windows`), the
# same as the jobs of `release.yml`.
#
# The logs and the artifacts of each run are deleted after the run (`cleanup.yml`).
#
# No `push:`, no `pull_request:` and no `schedule:`. Only a person with write access to this
# repository can start a run, so no other person can reach the secrets.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of the source repository
        required: true
        default: master
        type: string
      target:
        description: Which target to build ("all" builds every target)
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc

permissions:
  contents: read

jobs:
  # The one place that turns the input into a commit, so every later job builds the same
  # commit even when the branch moves during the run. It also creates the one draft of the
  # run, before any build job starts, so `contents: write`.
  resolve:
    name: resolve the source commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      desktop: ${{ steps.sha.outputs.desktop }}
      identity: ${{ steps.identity.outputs.identity }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the commit and require it on master for a signed APK
        id: sha
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          if { [ "$TARGET" = "android" ] || [ "$TARGET" = "all" ]; } && ! git merge-base --is-ancestor "$sha" origin/master; then
            echo "build: the android target signs only commits on master; ${sha} is not on master." >&2
            exit 1
          fi
          case "$TARGET" in
            all) desktop='["aarch64-apple-darwin","x86_64-apple-darwin","x86_64-pc-windows-msvc"]' ;;
            android) desktop='[]' ;;
            *) desktop="[\"${TARGET}\"]" ;;
          esac
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "desktop=${desktop}" >> "$GITHUB_OUTPUT"
          echo "build: source commit ${sha}"
      - name: Make the build identity of the commit
        id: identity
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          identity=$(node scripts/build-identity.mjs --print --commit "$SHA")
          echo "identity=${identity}" >> "$GITHUB_OUTPUT"
          echo "build: the build identity is ${identity}"
      # The notes name the targets of this run. With android, they also give the install
      # lines of the APK with the certificate digest of `android/release-cert.sha256`: the
      # job `android-sign` refuses an APK whose certificate has another digest. The notes
      # apply only when this run creates the draft.
      - name: Create the draft prerelease of the commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ inputs.target }}
          SRC_SHA: ${{ steps.sha.outputs.sha }}
          IDENTITY: ${{ steps.identity.outputs.identity }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            all) targets="aarch64-apple-darwin, x86_64-apple-darwin, x86_64-pc-windows-msvc, android" ;;
            *) targets="$TARGET" ;;
          esac
          notes="Unreleased build of ${SRC_SHA}. Targets of the first run: ${targets}. Draft prerelease: no tag, nothing published."
          if [ "$TARGET" = "android" ] || [ "$TARGET" = "all" ]; then
            version=$(jq -r .version <<< "$IDENTITY")
            digest=$(tr -d '[:space:]' < android/release-cert.sha256)
            apk_notes=$(bash scripts/android-release-notes.sh "cc-chatman_${version}_android.apk" "$digest")
            notes="${notes}"$'\n\n'"${apk_notes}"
          fi
          GITHUB_SHA="$SRC_SHA" bash scripts/attach-dev-build.sh create "$notes"

  desktop:
    name: build (${{ matrix.target }})
    needs: resolve
    if: ${{ needs.resolve.outputs.desktop != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.desktop) }}
    runs-on: >-
      ${{ fromJSON('{"aarch64-apple-darwin":"macos-15","x86_64-apple-darwin":"macos-15-intel","x86_64-pc-windows-msvc":"windows-latest"}')[matrix.target] }}
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      BUNDLES: >-
        ${{ fromJSON('{"aarch64-apple-darwin":"dmg,app","x86_64-apple-darwin":"dmg,app","x86_64-pc-windows-msvc":"nsis,msi"}')[matrix.target] }}
      SRC_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Write the build identity of the commit
        shell: bash
        env:
          IDENTITY: ${{ needs.resolve.outputs.identity }}
        run: node scripts/build-identity.mjs --from "$IDENTITY"
      - uses: oven-sh/setup-bun@v2
      - name: Install backend dependencies
        working-directory: backend
        run: bun install --frozen-lockfile
      - name: Build backend sidecar
        working-directory: backend
        env:
          CHATMAN_RELEASE_REPO: ${{ github.repository }}
          CHATMAN_RELEASE_TAG: ""
        run: bun run build:sidecar:${{ matrix.target }}
      - name: The built server starts
        if: runner.os == 'macOS'
        run: scripts/check-sidecar-starts.sh "src-tauri/binaries/chatman-${{ matrix.target }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        working-directory: manager/web
        run: npm ci
      - name: Build frontend
        working-directory: manager/web
        env:
          CHATMAN_RELEASE_REPO: ${{ github.repository }}
          CHATMAN_RELEASE_TAG: ""
        run: npm run build
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      # `tauri.conf.json` has no version (plan-r3 7.1). The bundle takes the version of the
      # identity through `--config`, so the file names and the installer carry it.
      - name: Write the version of the bundle
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -r .version build-identity.json)
          jq -n --arg v "$version" '{version: $v}' > "${RUNNER_TEMP}/tauri-version.json"
          cat "${RUNNER_TEMP}/tauri-version.json"
      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHATMAN_RELEASE_REPO: ${{ github.repository }}
          CHATMAN_RELEASE_TAG: ""
        with:
          args: --target ${{ matrix.target }} --bundles ${{ env.BUNDLES }} --config ${{ runner.temp }}/tauri-version.json
      - name: Upload the installers into the draft prerelease of the commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          root="src-tauri/target/${TARGET}/release/bundle"
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(
            find "$root" -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) | sort
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "build: no .dmg, .exe or .msi under ${root}; nothing to attach" >&2
            exit 1
          fi
          GITHUB_SHA="$SRC_SHA" bash scripts/attach-dev-build.sh upload "${files[@]}"

  # The backend suite on Windows, as the job `backend` of `release.yml` runs it on that leg.
  backend-windows:
    name: backend (windows-latest)
    needs: resolve
    if: ${{ inputs.target == 'x86_64-pc-windows-msvc' || inputs.target == 'all' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Write the build identity of the commit
        shell: bash
        env:
          IDENTITY: ${{ needs.resolve.outputs.identity }}
        run: node scripts/build-identity.mjs --from "$IDENTITY"
      - uses: oven-sh/setup-bun@v2
      - name: Install backend dependencies
        working-directory: backend
        run: bun install --frozen-lockfile
      - name: Type-check backend
        working-directory: backend
        run: bun run typecheck
      - name: Test backend
        working-directory: backend
        run: bun run test

  # The units of the shipped server on Windows. The steps are those of the job
  # `smoke-windows` of `release.yml`; the reasons are in ci.yml of the source.
  smoke-windows:
    name: smoke-windows
    needs: resolve
    if: ${{ inputs.target == 'x86_64-pc-windows-msvc' || inputs.target == 'all' }}
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    steps:
      - name: Resolve the smoke paths (outside the checkout)
        id: paths
        env:
          EXPECTED_OUT: ${{ runner.temp }}\chatman-smoke-out
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrEmpty($env:RUNNER_TEMP)) { throw 'RUNNER_TEMP is empty' }
          $root     = Join-Path $env:RUNNER_TEMP 'chatman-smoke'
          $out      = Join-Path $env:RUNNER_TEMP 'chatman-smoke-out'
          $manifest = Join-Path $out 'fixture-manifest.json'
          if ($out -cne $env:EXPECTED_OUT) {
            throw "smoke output dir '$out' disagrees with the artefact-upload path '$($env:EXPECTED_OUT)'"
          }
          $enc = New-Object System.Text.UTF8Encoding($false)
          $lines = "SMOKE_ROOT=$root`r`nSMOKE_OUT=$out`r`nSMOKE_MANIFEST=$manifest`r`n"
          [IO.File]::AppendAllText($env:GITHUB_ENV, $lines, $enc)
          Write-Host $lines
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Write the build identity of the commit
        shell: bash
        env:
          IDENTITY: ${{ needs.resolve.outputs.identity }}
        run: node scripts/build-identity.mjs --from "$IDENTITY"
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        id: deps
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: Unit 0 - static-check the smoke scripts (parse + unassigned reads)
        id: lint
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          SMOKE_UNIT: '0'
        run: .\.github\smoke-windows\check-scripts.ps1

      - name: Unit 2 - build the Windows sidecar and check its exact path
        id: build
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        timeout-minutes: 10
        env:
          SMOKE_UNIT: '2'
        run: .\.github\smoke-windows\assert-sidecar-build.ps1 -RepoRoot "${{ github.workspace }}"

      - name: Unit 3 - lay the hostile fixture (long path, junction, cycle, credential)
        id: fixture
        if: ${{ !cancelled() && steps.paths.outcome == 'success' }}
        timeout-minutes: 5
        env:
          SMOKE_UNIT: '3'
        run: >-
          .\.github\smoke-windows\lay-fixture.ps1
          -Root "$env:SMOKE_ROOT" -RepoRoot "${{ github.workspace }}" -ManifestPath "$env:SMOKE_MANIFEST"

      - name: Unit 3 + 4b - run the shipped .exe against the fixture
        id: api
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.fixture.outcome == 'success' }}
        timeout-minutes: 15
        env:
          SMOKE_UNIT: 3b
        run: >-
          .\.github\smoke-windows\assert-api.ps1
          -RepoRoot "${{ github.workspace }}" -ManifestPath "$env:SMOKE_MANIFEST" -LogDir "$env:SMOKE_OUT"

      # The timeout of this step must stay equal to the one of the same step in ci.yml of
      # the source:
      # `assert-launcher.ps1` checks its own worst case against it.
      - name: Unit 4a - launch through real PowerShell and check the argv it delivered
        id: launcher
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' && steps.deps.outcome == 'success' }}
        timeout-minutes: 10
        env:
          SMOKE_UNIT: 4a
        run: >-
          .\.github\smoke-windows\assert-launcher.ps1
          -RepoRoot "${{ github.workspace }}" -ManifestPath "$env:SMOKE_MANIFEST" -LogDir "$env:SMOKE_OUT"

      - name: Unit 5 - execute the keep-awake payload and check the orphan guard
        id: keepawake
        if: ${{ !cancelled() && steps.paths.outcome == 'success' && steps.deps.outcome == 'success' }}
        timeout-minutes: 10
        env:
          SMOKE_UNIT: '5'
        run: >-
          .\.github\smoke-windows\assert-keepawake.ps1
          -RepoRoot "${{ github.workspace }}" -LogDir "$env:SMOKE_OUT"

      - name: Unit 6 - the errno Windows gives for an unreadable root and a symlink cycle
        id: errno
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' && steps.deps.outcome == 'success' }}
        timeout-minutes: 10
        env:
          SMOKE_UNIT: '6'
        run: >-
          .\.github\smoke-windows\assert-root-errno.ps1
          -RepoRoot "${{ github.workspace }}" -ManifestPath "$env:SMOKE_MANIFEST" -LogDir "$env:SMOKE_OUT"

      # One day, not the 30 of ci.yml: the artifacts of a successful run are deleted by
      # `cleanup.yml`, and a failed run is read the same day.
      - name: Upload smoke artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-windows-artefacts
          path: ${{ runner.temp }}\chatman-smoke-out
          if-no-files-found: warn
          retention-days: 1

      - name: Every unit that ran contributed a ledger
        if: always()
        timeout-minutes: 5
        env:
          UNIT_OUTCOMES: >-
            {"0":"${{ steps.lint.outcome }}",
            "2":"${{ steps.build.outcome }}",
            "3":"${{ steps.fixture.outcome }}",
            "3b":"${{ steps.api.outcome }}",
            "4a":"${{ steps.launcher.outcome }}",
            "5":"${{ steps.keepawake.outcome }}",
            "6":"${{ steps.errno.outcome }}"}
        run: >-
          .\.github\smoke-windows\assert-units-reported.ps1
          -LogDir "$env:SMOKE_OUT" -Outcomes "$env:UNIT_OUTCOMES"


  # Gradle runs here, so this job has no secret except the read-only source key, and only
  # `contents: read`.
  android-build:
    name: build (android)
    needs: resolve
    if: ${{ inputs.target == 'android' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      ANDROID_BUILD_TOOLS_VERSION: 36.0.0
      ANDROID_PLATFORM: android-36
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Write the build identity of the commit
        shell: bash
        env:
          IDENTITY: ${{ needs.resolve.outputs.identity }}
        run: node scripts/build-identity.mjs --from "$IDENTITY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Plan-r3 2.2 item 1 (K4): the APK holds the phone page of the web build of this commit.
      # Gradle task `copyPhonePage` copies it from `manager/web/dist` and stops when the
      # identity of that build is not the identity of the APK.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: manager/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: manager/web
        run: npm ci
      - name: Build frontend for the APK
        working-directory: manager/web
        env:
          CHATMAN_RELEASE_REPO: ${{ github.repository }}
          CHATMAN_RELEASE_TAG: ""
        run: npm run build
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.6.1
      - name: Require the SDK packages
        run: |
          set -euo pipefail
          for need in "build-tools/${ANDROID_BUILD_TOOLS_VERSION}/aapt2" "platforms/${ANDROID_PLATFORM}/android.jar"; do
            if [ ! -f "${ANDROID_HOME}/${need}" ]; then
              echo "build: ${ANDROID_HOME}/${need} is not on this runner image" >&2
              exit 1
            fi
          done
      - name: Test the Android app and build the unsigned release APK
        run: gradle -p android --quiet testDebugUnitTest assembleRelease
      - name: Check the package line of the APK
        id: version
        run: |
          set -euo pipefail
          version=$(jq -r .version build-identity.json)
          bash scripts/check-apk-badging.sh android/app/build/outputs/apk/release/app-release-unsigned.apk "$version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  # The signing secrets are only here, and no Gradle runs here.
  android-sign:
    name: sign (android)
    needs: [resolve, android-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      ANDROID_BUILD_TOOLS_VERSION: 36.0.0
      SRC_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            android/release-cert.sha256
            scripts/sign-apk.sh
            scripts/attach-dev-build.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: android-unsigned
          path: ${{ runner.temp }}/android-unsigned
      - name: Sign the APK and check its certificate
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.android-build.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/signed"
          signed="${RUNNER_TEMP}/signed/cc-chatman_${VERSION}_android.apk"
          bash scripts/sign-apk.sh "${RUNNER_TEMP}/android-unsigned/app-release-unsigned.apk" "$signed" \
            > "${RUNNER_TEMP}/sign.log"
          digest=$(tail -n 1 "${RUNNER_TEMP}/sign.log")
          {
            echo "cert_sha256=${digest}"
            echo "signed=${signed}"
          } >> "$GITHUB_OUTPUT"
      - name: Upload the APK into the draft prerelease of the commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          set -euo pipefail
          GITHUB_SHA="$SRC_SHA" bash scripts/attach-dev-build.sh upload "$SIGNED"
