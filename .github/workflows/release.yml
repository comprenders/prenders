name: release

# A release of the app. `scripts/release.sh [--draft] major|minor|patch` of the source
# repository computes the next version from the last release tag (semantic versioning) and
# pushes the tag `v<version>` there. The scheduled workflow `release-start.yml` of this
# repository reads the tags of the source and starts this workflow with each new tag, one
# run for each tag. A person with write access can also start it by hand.
#
# No file of the source holds the version (plan-r3 7.1). `resolve` makes the build identity
# of the tag (`scripts/build-identity.mjs --print`), and each job that builds or tests
# writes it to `build-identity.json` of its checkout (`--from`), which also checks that the
# checkout is the commit of the identity.
# This repository holds the workflow files and the releases; it holds no app code. The
# source is read with a read-only deploy key (secret SOURCE_DEPLOY_KEY) from the
# repository named in the secret SOURCE_REPO.
#
# This file is the one release workflow (plan of 2026-11-08, row F5a+RL1a+TC1): the source
# repository has no workflow file since that row. The jobs:
# - `resolve` turns the tag into a commit and makes the build identity.
# - `workflow-guards` lints the workflow files of this repository and checks the relations
#   between the jobs (yq and jq) and the Bun pin against the source.
# - `static-rules` runs the Opengrep rules of the source on the source tree and on this file.
# - The test jobs: `backend`, `smoke-windows`, `frontend`, `python`, `rust`, `android-test`.
# - The package jobs: `bundle`, `android`, `android-sign`. Each needs every job above.
# - `publish` makes the release. The steps that touch the release are in
#   `scripts/publish-release.sh` of the source.
#
# Every job builds the commit that `resolve` found for the tag, never the tag name, so a
# tag that moves during the run changes nothing.
#
# With `draft: true` the run makes a DRAFT release with the name of the tag. A draft has
# no git tag and only a person with push access can see it, so nothing is published.
#
# The logs and the artifacts of a successful run are deleted after the run
# (`cleanup.yml`).
#
# No `push:`, no `pull_request:` and no `schedule:`. Only a person with write access to
# this repository and the workflow `release-start.yml` of this repository can start a run,
# so no other person can reach the secrets.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: A v* tag of the source repository (its commit must be on master)
        required: true
        type: string
      draft:
        description: Make a draft release, for a test run (nothing is published)
        required: false
        default: false
        type: boolean

run-name: release ${{ inputs.tag }}${{ inputs.draft && ' (draft)' || '' }}

permissions:
  contents: read

# The one Bun pin of the workflow. Every setup-bun step names it (the Opengrep rule
# `release-bun-pin-from-env` of the source), and the job `workflow-guards` compares it with
# `BUN_PIN` of `backend/scripts/build-sidecar.ts` of the source.
env:
  BUN_VERSION: "1.4.0"
  # The one Gradle version of the Android jobs (the Opengrep rule
  # `release-gradle-version-from-env` of the source refuses a literal version).
  GRADLE_VERSION: "9.6.1"

# Two runs for one tag could each find no release and each create one. The second run
# waits for the first.
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # The one place that turns the tag into a commit. It refuses unless the tag exists in
  # the source repository and its commit is on master. Only a commit on master is signed.
  resolve:
    name: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      identity: ${{ steps.identity.outputs.identity }}
    steps:
      - name: Refuse a tag that is not v and a version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9A-Za-z.-]+$ ]]; then
            echo "release: the tag \"${TAG}\" is not v followed by a version" >&2
            exit 1
          fi
      # No `ref:`, so the default branch of the source. `fetch-depth: 0` fetches every
      # branch and every tag, so the tag and origin/master are both here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the tag and require its commit on master
        id: sha
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! sha=$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}"); then
            echo "release: the source repository has no tag ${TAG}" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" origin/master; then
            echo "release: the tag ${TAG} is at ${sha}, which is not on master; a release signs only commits on master" >&2
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "release: ${TAG} is the source commit ${sha}"
      # The scripts and the tests of the tag commit, not of master.
      - name: Switch to the tag commit
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: git switch --quiet --detach "$SHA"
      # A release is a final version. The rule is `version-check.mjs` of the tag commit; a
      # release candidate stops the run here, before any build.
      - name: Refuse a release candidate
        env:
          TAG: ${{ inputs.tag }}
        run: node scripts/version-check.mjs valid --final "${TAG#v}"
      # The tag is in the grammar, points at the commit and is higher than every other
      # release tag that the commit reaches; else the script names the fault and stops.
      - name: Make the build identity of the tag
        id: identity
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          identity=$(node scripts/build-identity.mjs --print --commit "$SHA" --tag "$TAG")
          echo "identity=${identity}" >> "$GITHUB_OUTPUT"
          echo "release: the build identity is ${identity}"
      # No tracked file holds the number of the tag, and the script works (plan-r3 7.1).
      - name: Test the build identity and that no file holds the version
        run: node --test scripts/tests/*.test.mjs

  # The guards of the workflow files of this repository (base design-02 3.1 of the cleanup
  # plan). actionlint: a malformed expression, an unknown `needs:` or a matrix key that is
  # not defined can survive the parse of GitHub and give an empty value instead of an
  # error. The yq and jq steps check the relations between jobs. The pattern guards are the
  # Opengrep rules of the job `static-rules`.
  workflow-guards:
    name: workflow-guards
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      SHELLCHECK_VERSION: 0.11.0
      SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
      # yq reads the job graph of this file for the step "Each package job needs every
      # test job". The digest is the one that GitHub gives for the asset yq_linux_amd64.
      YQ_VERSION: 4.54.1
      YQ_SHA256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The source at the tag commit, in `source/`: the Bun pin step imports `BUN_PIN`, and
      # the script path step looks for each path that a job names.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install backend dependencies for the Bun pin step
        working-directory: source/backend
        run: bun install --frozen-lockfile
      # `build-sidecar.ts` refuses a Bun that is not BUN_PIN, so a release with two pins
      # fails late, in `bundle`. This step fails at the start. Plain `node -e` cannot
      # import a `.ts` file; `bun -e` can. The import runs no build: the script builds only
      # under `import.meta.main`.
      - name: The workflow Bun pin is BUN_PIN of the source
        env:
          SIDECAR: ${{ github.workspace }}/source/backend/scripts/build-sidecar.ts
        run: |
          set -euo pipefail
          bun -e '
            const { BUN_PIN } = await import(process.env.SIDECAR);
            if (BUN_PIN !== process.env.BUN_VERSION) {
              console.error("release: the workflow env BUN_VERSION is " + process.env.BUN_VERSION + ", BUN_PIN of the sidecar build script is " + BUN_PIN);
              process.exit(1);
            }
            console.log("release: BUN_VERSION and BUN_PIN are " + BUN_PIN);
          '
      - name: Install actionlint
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -version
      - name: Install shellcheck
        run: |
          set -euo pipefail
          tarball="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${tarball}"
          echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" --strip-components=1 \
            "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          "${RUNNER_TEMP}/shellcheck" --version
      - name: Install yq
        run: |
          set -euo pipefail
          binary="${RUNNER_TEMP}/yq"
          curl -fsSL --retry 3 -o "$binary" \
            "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  ${binary}" | sha256sum --check --strict
          chmod +x "$binary"
          "$binary" --version
      # A package job starts only after every test job passed, so a failed test makes no
      # package (backlog 2026-11-04, row 12). PACKAGE_JOBS is the one list of the package
      # jobs. Every other job, except `publish`, is a test job, so a new test job is
      # required at once. A new package job that is not in the list counts as a test job,
      # and the package jobs do not need it, so this step fails until the list names it.
      # A `needs:` that is not direct counts (android-sign needs android, which needs the
      # tests). `publish` must need every other job, because its first step checks only
      # the jobs that it needs.
      - name: Each package job needs every test job
        env:
          PACKAGE_JOBS: '["bundle", "android", "android-sign"]'
        run: |
          set -euo pipefail
          faults=$("${RUNNER_TEMP}/yq" -o=json '.jobs' .github/workflows/release.yml \
            | jq -r --argjson packages "$PACKAGE_JOBS" '
                def needs($job): (.[$job].needs // []) | if type == "string" then [.] else . end;
                def closure($job): [needs($job)[] as $n | $n, closure($n)[]] | unique;
                (keys) as $all
                | ($all - $packages - ["publish"]) as $tests
                | ($packages - $all | .[] | "the package job \(.) is not in the file"),
                  ($packages[] as $p | select($p | IN($all[]))
                    | $tests - closure($p) | .[] | "the package job \($p) does not need the test job \(.)"),
                  ($all - ["publish"] - needs("publish") | .[] | "the job publish does not need the job \(.)")')
          if [ -n "$faults" ]; then
            echo "$faults" >&2
            exit 1
          fi
          echo "release: each package job needs every test job, and publish needs every job"
      # An artifact is kept for a known time, and a download names an artifact that a job
      # before it uploads. A download by a name or a pattern that no needed job uploads
      # gets no file, and the step after it fails with a cause that names no artifact.
      - name: Each artifact has a retention, and each download has its upload
        run: |
          set -euo pipefail
          faults=$("${RUNNER_TEMP}/yq" -o=json '.jobs' .github/workflows/release.yml \
            | jq -r '
                def needs($job): (.[$job].needs // []) | if type == "string" then [.] else . end;
                def closure($job): [needs($job)[] as $n | $n, closure($n)[]] | unique;
                def steps_using($job; $action):
                  (.[$job].steps // [])[] | select((.uses // "") | startswith($action + "@"));
                . as $jobs
                | [keys[] as $j | $jobs | steps_using($j; "actions/upload-artifact") | {job: $j, name: .with.name, days: .with["retention-days"]}] as $uploads
                | ($uploads[] | select(.days == null) | "the upload \(.name) of the job \(.job) has no retention-days"),
                  (keys[] as $j | $jobs | steps_using($j; "actions/download-artifact")
                    | (.with.name // .with.pattern) as $want
                    | ($want | gsub("\\*"; ".*") | "^" + . + "$") as $re
                    | ($jobs | closure($j)) as $before
                    | select([$uploads[] | select(.job | IN($before[])) | select(.name | test($re))] | length == 0)
                    | "the job \($j) downloads \($want), which no job that it needs uploads")')
          if [ -n "$faults" ]; then
            echo "$faults" >&2
            exit 1
          fi
          echo "release: each artifact has a retention, and each download has its upload"
      # Each script path that a `run:` names exists in the checkout of its job: the source
      # at the tag commit (`source/` here), inside the sparse set when the job has one. A
      # path of a job that checks out the source into a folder (`path:`) is read inside
      # that folder; any other path of such a job is a path of this repository. A job with
      # a script that is not in its checkout fails late, after its setup (review RC-7).
      - name: Each script path that a job runs is in the checkout of the job
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/yq" -o=json '.jobs' .github/workflows/release.yml \
            | jq -r '
                to_entries[] | .key as $job | (.value.steps // []) as $steps
                | ([$steps[] | select((.uses // "") | startswith("actions/checkout@"))
                    | select((.with.repository // "") | test("SOURCE_REPO"))][0] // null) as $src
                | (if $src == null then null else ($src.with.path // "") end) as $root
                | (if $src == null or ($src.with["sparse-checkout"] // null) == null then null
                   else [$src.with["sparse-checkout"] | split("\n")[] | select(length > 0)] end) as $sparse
                | $steps[] | select(.run != null)
                | (.["working-directory"] // "") as $wd
                | .run | gsub("\\\\"; "/")
                | [scan("(?:^|[\\s\"'"'"'=])(?:\\./)?([A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)+\\.(?:mjs|cjs|js|ts|sh|ps1|py))(?=$|[\\s\"'"'"';)])")[0]] | unique[]
                | (if $wd == "" then . else $wd + "/" + . end) as $path
                | if $root == null or ($root != "" and ($path | startswith($root + "/") | not)) then
                    "\($job)\tthis\t\($path)\t"
                  else
                    (if $root == "" then $path else $path[($root | length) + 1:] end) as $rel
                    | "\($job)\tsource\t\($rel)\t\($sparse // [] | join(" "))"
                  end' | sort -u > "${RUNNER_TEMP}/script-paths.tsv"
          faults=0
          while IFS=$'\t' read -r job where path sparse; do
            if [ "$where" = this ]; then
              [ -e "$path" ] && continue
              echo "the job ${job} runs ${path}, which is not in this repository" >&2
              faults=$((faults + 1))
              continue
            fi
            if [ ! -e "source/${path}" ]; then
              echo "the job ${job} runs ${path}, which is not in the source at the tag commit" >&2
              faults=$((faults + 1))
              continue
            fi
            if [ -n "$sparse" ]; then
              found=no
              for entry in $sparse; do
                entry="${entry#/}"
                if [ "$path" = "$entry" ] || { [ "${entry%/}" != "$entry" ] && [ "${path#"$entry"}" != "$path" ]; }; then
                  found=yes
                fi
              done
              if [ "$found" = no ]; then
                echo "the job ${job} runs ${path}, which is not in the sparse checkout of the job" >&2
                faults=$((faults + 1))
              fi
            fi
          done < "${RUNNER_TEMP}/script-paths.tsv"
          if [ "$faults" -ne 0 ]; then
            exit 1
          fi
          echo "release: each script path is in the checkout of its job ($(wc -l < "${RUNNER_TEMP}/script-paths.tsv") paths)"
      # Build review A1: this run holds the signing secrets and the write token, so every
      # action of every workflow of this repository is named by a commit hash, which cannot
      # move. A tag such as `@v4` can move. The comment after the hash names the tag.
      - name: Every action is pinned by a commit hash
        run: |
          set -euo pipefail
          unpinned=$(grep -nE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows/*.yml \
            | grep -vE 'uses:[[:space:]]*[^@[:space:]]+@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [ -n "$unpinned" ]; then
            echo "These uses: lines name an action by a tag and not by a commit hash:" >&2
            echo "$unpinned" >&2
            exit 1
          fi
      - name: Lint every workflow file
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/actionlint" -color \
            -shellcheck="${RUNNER_TEMP}/shellcheck" -pyflakes=

  # The Opengrep rules of the source (base design-01 3.4 and design-02 3.9 of the cleanup
  # plan): the rule fixtures, then the scan of the source tree, then the scan of this file
  # with the workflow rules (`release-workflow-guards.yml`). The scan of this file names
  # its absolute path: a relative path into another git checkout gives no file to scan.
  static-rules:
    name: static-rules
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false
      - name: Install the pinned Opengrep
        run: bash source/scripts/install-opengrep.sh
      - name: The rules and the scan of the source
        run: bash source/scripts/static-rules.sh
      - name: The workflow rules on this release workflow
        run: bash source/scripts/static-rules.sh "${GITHUB_WORKSPACE}/.github/workflows/release.yml"

  backend:
    name: backend (${{ matrix.os }})
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        # Row TC1: the abilities of each runner image (`backend/tests/helpers/platform-fs.ts`
        # of the source). The global setup of the tests stops the run when a probe
        # disagrees. The values are facts of the images; the draft run of row RL1b
        # confirms them.
        include:
          - os: ubuntu-latest
            abilities: symlink,deny-dir-access
          - os: macos-15
            abilities: symlink,deny-dir-access,case-insensitive-volume
          - os: windows-latest
            abilities: junction,case-insensitive-volume
    env:
      PRENDERS_ABILITIES: ${{ matrix.abilities }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Write the build identity of the tag
        shell: bash
        env:
          IDENTITY: ${{ needs.resolve.outputs.identity }}
        run: node scripts/build-identity.mjs --from "$IDENTITY"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        # The Bun of the build: the workflow env BUN_VERSION.
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Each check runs when its setup passed, so a type error does not hide a test failure
      # (OD7 of the process rework, round 3). The form of `smoke-windows`.
      - name: Install backend dependencies
        id: deps
        working-directory: backend
        run: bun install --frozen-lockfile
      - name: Type-check backend
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        working-directory: backend
        run: bun run typecheck
      - name: Test backend
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        working-directory: backend
        run: bun run test

  # The only job that runs the shipped runtime on Windows. Each unit has its reason in the
  # script of the unit (`.github/smoke-windows/` of the source).
  smoke-windows:
    name: smoke-windows
    needs: resolve
    runs-on: windows-latest
    timeout-minutes: 90
    # Row TC1: the abilities of the image, the same value as the windows leg of `backend`.
    env:
      PRENDERS_ABILITIES: junction,case-insensitive-volume
    defaults:
      run:
        shell: powershell
    steps:
      - name: Resolve the smoke paths (outside the checkout)
        id: paths
        env:
          EXPECTED_OUT: ${{ runner.temp }}\chatman-smoke-out
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrEmpty($env:RUNNER_TEMP)) { throw 'RUNNER_TEMP is empty' }
          $root     = Join-Path $env:RUNNER_TEMP 'chatman-smoke'
          $out      = Join-Path $env:RUNNER_TEMP 'chatman-smoke-out'
          $manifest = Join-Path $out 'fixture-manifest.json'
          if ($out -cne $env:EXPECTED_OUT) {
            throw "smoke output dir '$out' disagrees with the artefact-upload path '$($env:EXPECTED_OUT)'"
          }
          $enc = New-Object System.Text.UTF8Encoding($false)
          $lines = "SMOKE_ROOT=$root`r`nSMOKE_OUT=$out`r`nSMOKE_MANIFEST=$manifest`r`n"
          [IO.File]::AppendAllText($env:GITHUB_ENV, $lines, $enc)
          Write-Host $lines
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Write the build identity of the tag
        shell: bash
        env:
          IDENTITY: ${{ needs.resolve.outputs.identity }}
        run: node scripts/build-identity.mjs --from "$IDENTITY"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        # The Bun of the build: the workflow env BUN_VERSION.
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Install backend dependencies
        id: deps
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: Unit 0 - static-check the smoke scripts (parse + unassigned reads)
        id: lint
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          SMOKE_UNIT: '0'
        run: .\.github\smoke-windows\check-scripts.ps1

      - name: Unit 2 - build the Windows sidecar and check its exact path
        id: build
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        timeout-minutes: 10
        env:
          SMOKE_UNIT: '2'
        run: .\.github\smoke-windows\assert-sidecar-build.ps1 -RepoRoot "${{ github.workspace }}"

      - name: Unit 3 - lay the hostile fixture (long path, junction, cycle, credential)
        id: fixture
        if: ${{ !cancelled() && steps.paths.outcome == 'success' }}
        timeout-minutes: 5
        env:
          SMOKE_UNIT: '3'
        run: >-
          .\.github\smoke-windows\lay-fixture.ps1
          -Root "$env:SMOKE_ROOT" -RepoRoot "${{ github.workspace }}" -ManifestPath "$env:SMOKE_MANIFEST"

      - name: Unit 3 + 4b - run the shipped .exe against the fixture
        id: api
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.fixture.outcome == 'success' }}
        timeout-minutes: 15
        env:
          SMOKE_UNIT: 3b
        run: >-
          .\.github\smoke-windows\assert-api.ps1
          -RepoRoot "${{ github.workspace }}" -ManifestPath "$env:SMOKE_MANIFEST" -LogDir "$env:SMOKE_OUT"

      # `assert-launcher.ps1` checks its own worst case against the timeout of this step.
      - name: Unit 4a - launch through real PowerShell and check the argv it delivered
        id: launcher
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' && steps.deps.outcome == 'success' }}
        timeout-minutes: 10
        env:
          SMOKE_UNIT: 4a
        run: >-
          .\.github\smoke-windows\assert-launcher.ps1
          -RepoRoot "${{ github.workspace }}" -ManifestPath "$env:SMOKE_MANIFEST" -LogDir "$env:SMOKE_OUT"

      - name: Unit 5 - execute the keep-awake payload and check the orphan guard
        id: keepawake
        if: ${{ !cancelled() && steps.paths.outcome == 'success' && steps.deps.outcome == 'success' }}
        timeout-minutes: 10
        env:
          SMOKE_UNIT: '5'
        run: >-
          .\.github\smoke-windows\assert-keepawake.ps1
          -RepoRoot "${{ github.workspace }}" -LogDir "$env:SMOKE_OUT"

      - name: Unit 6 - the errno Windows gives for an unreadable root and a symlink cycle
        id: errno
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' && steps.deps.outcome == 'success' }}
        timeout-minutes: 10
        env:
          SMOKE_UNIT: '6'
        run: >-
          .\.github\smoke-windows\assert-root-errno.ps1
          -RepoRoot "${{ github.workspace }}" -ManifestPath "$env:SMOKE_MANIFEST" -LogDir "$env:SMOKE_OUT"

      # One day: the artifacts of a successful run are deleted by `cleanup.yml`, and a
      # failed run is read the same day. No job downloads them; a person reads them.
      - name: Upload smoke artefacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-windows-artefacts
          path: ${{ runner.temp }}\chatman-smoke-out
          if-no-files-found: warn
          retention-days: 1

      - name: Every unit that ran contributed a ledger
        if: always()
        timeout-minutes: 5
        env:
          UNIT_OUTCOMES: >-
            {"0":"${{ steps.lint.outcome }}",
            "2":"${{ steps.build.outcome }}",
            "3":"${{ steps.fixture.outcome }}",
            "3b":"${{ steps.api.outcome }}",
            "4a":"${{ steps.launcher.outcome }}",
            "5":"${{ steps.keepawake.outcome }}",
            "6":"${{ steps.errno.outcome }}"}
        run: >-
          .\.github\smoke-windows\assert-units-reported.ps1
          -LogDir "$env:SMOKE_OUT" -Outcomes "$env:UNIT_OUTCOMES"

  frontend:
    name: frontend
    needs: resolve
    runs-on: ubuntu-latest
    # Row 59: the job runs the jsdom suite and the browser suite, which had 30 minutes each.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Write the build identity of the tag
        id: identity
        shell: bash
        env:
          IDENTITY: ${{ needs.resolve.outputs.identity }}
        run: node scripts/build-identity.mjs --from "$IDENTITY"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: manager/web/package-lock.json
      - name: Install frontend dependencies
        id: web-deps
        working-directory: manager/web
        run: npm ci
      # The source scans of the web tests import `backend/tests/helpers/source-scan.ts` of the
      # app repository, which reads the TypeScript 5 parser of the backend copy by its path, and
      # the web build type-checks them. So this job installs the backend packages too, as the
      # backend job does. The Bun pin is the workflow env BUN_VERSION.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install backend dependencies for the source scans
        id: backend-deps
        working-directory: backend
        run: bun install --frozen-lockfile
      # Each check runs when its setup passed, so one failed check does not hide the result
      # of the next one (OD7 of the process rework, round 3). The form of `smoke-windows`.
      # The build is a check here (it type-checks); no later step reads `dist`.
      - name: Build frontend
        if: ${{ !cancelled() && steps.web-deps.outcome == 'success' && steps.backend-deps.outcome == 'success' }}
        working-directory: manager/web
        run: npm run build
      - name: Test frontend
        if: ${{ !cancelled() && steps.web-deps.outcome == 'success' && steps.backend-deps.outcome == 'success' }}
        working-directory: manager/web
        run: npm test
      # Backlog 2026-11-04 reader-voice, rows 48 and 59: the tests that see the real phone
      # layout (`*.browser.test.tsx`, `manager/web/vitest.browser.config.ts`) run here in
      # Chromium on Linux, so a release does not need the PC for them. They use the setup
      # steps above (the global setup of the browser suite, `test-setup/run-home.ts`, imports
      # the backend test helpers), so this job is the one owner of the frontend setup. The browser is the headless shell of the installed
      # `playwright` package, with the system libraries that it needs. It needs no secret.
      # Both steps name one browser folder (PLAYWRIGHT_BROWSERS_PATH): the browser suite sets
      # HOME to a fixture home (`test-setup/run-home.ts`), so the default cache under the real
      # home is not where the run looks.
      - name: Install the browser of the layout tests
        id: browser
        if: ${{ !cancelled() && steps.web-deps.outcome == 'success' }}
        working-directory: manager/web
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: npx playwright install --with-deps --only-shell chromium
      - name: Test the phone layout in a real browser
        if: ${{ !cancelled() && steps.web-deps.outcome == 'success' && steps.backend-deps.outcome == 'success' && steps.browser.outcome == 'success' }}
        working-directory: manager/web
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: npm run test:browser
      - name: Audit frontend dependencies
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        working-directory: manager/web
        run: npm audit --audit-level=high

  python:
    name: python (${{ matrix.python-version }})
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      # The app ships the four /wiki tools of tools/ (tauri.conf.json resources), so
      # this job checks tools/ only. The old manager/ Python server is removed.
      # Each check runs when its setup passed (OD7 of the process rework, round 3).
      - name: Install Python package
        id: deps
        run: pip install -e ".[dev]"
      - name: Lint
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: ruff check tools
      - name: Type-check
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pyright tools
      - name: Test
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pytest tools/tests --tb=short -q

  # The Rust tests are a test job, so a Rust test failure shows in the same run as every
  # other test failure (OD7 of the process rework, round 3). The build of `tauri.conf.json` needs the sidecar
  # (`binaries/chatman`) and the web build (`../manager/web/dist`), so this job makes both
  # with the steps of `bundle`. No secret except the read-only source key.
  rust:
    name: rust (${{ matrix.triple }})
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            triple: aarch64-apple-darwin
          - os: macos-15-intel
            triple: x86_64-apple-darwin
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Write the build identity of the tag
        shell: bash
        env:
          IDENTITY: ${{ needs.resolve.outputs.identity }}
        run: node scripts/build-identity.mjs --from "$IDENTITY"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        # The Bun of the build: the workflow env BUN_VERSION.
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install backend dependencies
        working-directory: backend
        run: bun install --frozen-lockfile
      - name: Build backend sidecar
        working-directory: backend
        env:
          CHATMAN_RELEASE_REPO: ${{ github.repository }}
          CHATMAN_RELEASE_TAG: ${{ inputs.tag }}
        run: bun run build:sidecar:${{ matrix.triple }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: manager/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: manager/web
        run: npm ci
      - name: Build frontend
        working-directory: manager/web
        env:
          CHATMAN_RELEASE_REPO: ${{ github.repository }}
          CHATMAN_RELEASE_TAG: ${{ inputs.tag }}
        run: npm run build
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          # With a commit hash in `uses:` the action cannot take the toolchain from the
          # ref name, so the floating `stable` is named here (plan-r3 L1001).
          toolchain: stable
          targets: ${{ matrix.triple }}
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  # The Android JVM tests are a test job, so an Android test failure shows in the same run
  # as every other test failure (OD7 of the process rework, round 3). The setup is the setup of `android`; the reasons of
  # each step are there.
  android-test:
    name: android-test
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Next-batch plan, N9: the count line of the JVM tests, for the release notes.
    outputs:
      jvm_tests: ${{ steps.jvm.outputs.jvm_tests }}
    env:
      ANDROID_BUILD_TOOLS_VERSION: 36.0.0
      ANDROID_PLATFORM: android-36
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Write the build identity of the tag
        shell: bash
        env:
          IDENTITY: ${{ needs.resolve.outputs.identity }}
        run: node scripts/build-identity.mjs --from "$IDENTITY"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      # Row REL2-4: the Gradle task `checkRunDataSafety` runs before the JVM tests with Bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        # The Bun of the build: the workflow env BUN_VERSION.
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: manager/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: manager/web
        run: npm ci
      - name: Install backend dependencies for the source scans
        working-directory: backend
        run: bun install --frozen-lockfile
      - name: Build frontend for the APK
        working-directory: manager/web
        env:
          CHATMAN_RELEASE_REPO: ${{ github.repository }}
          CHATMAN_RELEASE_TAG: ${{ inputs.tag }}
        run: npm run build
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      # Design-04 W8 note 2026-11-11, point 2: the one owner of the SDK check is in the source.
      - name: Require the SDK packages
        run: bash scripts/require-android-sdk.sh android-test
      - name: Test the Android app
        run: gradle -p android testDebugUnitTest
      # Next-batch plan, N9: `cleanup.yml` deletes the log of a green run, so the count goes
      # to the job summary and, through the job output, to the release notes. No result
      # file, or no test, fails the job.
      - name: Count the Android JVM tests
        id: jvm
        run: |
          set -euo pipefail
          line=$(node scripts/junit-count.mjs)
          printf '%s\n' "$line" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'jvm_tests=%s\n' "$line" >> "$GITHUB_OUTPUT"
      # Review AN-17: each Kotlin test of the list ran, found by its test class file.
      - name: Each Kotlin test of the list ran
        run: node scripts/check-android-test-list.mjs

  # Build only: tauri-action gets no `tagName` and no `releaseId`, so it makes no
  # release-API call. The release is made by `publish`, once, after every check.
  # CHATMAN_RELEASE_REPO is THIS repository, because the releases are here.
  # The package jobs (`bundle`, `android`, `android-sign`) start only after every test job
  # passed (backlog 2026-11-04, row 12). The step "Each package job needs every test
  # job" of `workflow-guards` keeps this order.
  bundle:
    name: bundle (${{ matrix.triple }})
    needs: [resolve, workflow-guards, static-rules, backend, smoke-windows, frontend, python, rust, android-test]
    runs-on: ${{ matrix.os }}
    # Next-batch plan, N11: the GitHub environment `release-signing` holds the seven Apple
    # secrets. Only the macOS legs get it; the Windows leg has an empty name, so no
    # environment and no Apple secret.
    environment: ${{ matrix.environment }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            triple: aarch64-apple-darwin
            bundles: dmg,app
            environment: release-signing
            artifact_glob: |-
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - os: macos-15-intel
            triple: x86_64-apple-darwin
            bundles: dmg,app
            environment: release-signing
            artifact_glob: |-
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            bundles: nsis,msi
            environment: ""
            artifact_glob: |-
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.sig
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Write the build identity of the tag
        shell: bash
        env:
          IDENTITY: ${{ needs.resolve.outputs.identity }}
        run: node scripts/build-identity.mjs --from "$IDENTITY"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        # The Bun of the build: the workflow env BUN_VERSION.
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install backend dependencies
        working-directory: backend
        run: bun install --frozen-lockfile
      # Next-batch plan, N11, item 2: a release run has no unsigned macOS path. The script
      # names each empty secret and prints no value.
      - name: Refuse unless the macOS signing secrets are set
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: bash scripts/check-signing-env.sh macos
      # Next-batch plan, N11, item 3: its own step, so the file is there when tauri-action
      # reads it. The step "Remove the notarisation key" deletes it with `if: always()`.
      - name: Write the notarisation key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          key="${RUNNER_TEMP}/notarisation-key.p8"
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          echo "APPLE_API_KEY_PATH=${key}" >> "$GITHUB_ENV"
      - name: Build backend sidecar
        working-directory: backend
        env:
          CHATMAN_RELEASE_REPO: ${{ github.repository }}
          CHATMAN_RELEASE_TAG: ${{ inputs.tag }}
        run: bun run build:sidecar:${{ matrix.triple }}
      - name: The built server starts
        if: runner.os == 'macOS'
        run: scripts/check-sidecar-starts.sh "src-tauri/binaries/chatman-${{ matrix.triple }}"
      # The keeper (the process that holds a kept run) must start, read its hello, start
      # a child, move one line and end, on each leg, the Windows leg too. Its child is the
      # script itself in an echo mode, run by the Bun of this job.
      - name: The built keeper starts
        shell: bash
        run: bun scripts/check-keeper-starts.ts "src-tauri/binaries/chatman-keeper-${{ matrix.triple }}${{ runner.os == 'Windows' && '.exe' || '' }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: manager/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: manager/web
        run: npm ci
      - name: Build frontend
        working-directory: manager/web
        env:
          CHATMAN_RELEASE_REPO: ${{ github.repository }}
          CHATMAN_RELEASE_TAG: ${{ inputs.tag }}
        run: npm run build
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          # With a commit hash in `uses:` the action cannot take the toolchain from the
          # ref name, so the floating `stable` is named here (plan-r3 L1001).
          toolchain: stable
          targets: ${{ matrix.triple }}
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      # The Rust tests run in the test job `rust`, not here (OD7 of the process rework).
      # `tauri.conf.json` has no version (plan-r3 7.1). The bundle takes the version of the
      # identity through `--config`, so the file names and the installer carry it.
      # The update from inside the app: only this file sets `createUpdaterArtifacts` and the
      # endpoint of `latest.json`, so a build from the source makes no update
      # file and has no endpoint. The endpoint is the newest published release of THIS
      # repository, because the releases are here.
      # Next-batch plan, N11, item 4: on macOS the file also sets the Developer ID identity,
      # so the release does not depend on the order of the env value and the "-" of
      # `tauri.conf.json`.
      - name: Write the version of the bundle
        shell: bash
        env:
          RELEASE_REPO: ${{ github.repository }}
          SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: |
          set -euo pipefail
          version=$(jq -r .version build-identity.json)
          endpoint="https://github.com/${RELEASE_REPO}/releases/latest/download/latest.json"
          if [ "$RUNNER_OS" = macOS ]; then
            if [ -z "$SIGNING_IDENTITY" ]; then
              echo "bundle: the secret APPLE_SIGNING_IDENTITY is empty, so the macOS bundle cannot be signed." >&2
              exit 1
            fi
            jq -n --arg v "$version" --arg endpoint "$endpoint" --arg identity "$SIGNING_IDENTITY" \
              '{version: $v, bundle: {createUpdaterArtifacts: true, macOS: {signingIdentity: $identity}}, plugins: {updater: {endpoints: [$endpoint]}}}' \
              > "${RUNNER_TEMP}/tauri-version.json"
          else
            jq -n --arg v "$version" --arg endpoint "$endpoint" \
              '{version: $v, bundle: {createUpdaterArtifacts: true}, plugins: {updater: {endpoints: [$endpoint]}}}' \
              > "${RUNNER_TEMP}/tauri-version.json"
          fi
          cat "${RUNNER_TEMP}/tauri-version.json"
      # The two signing secrets sign the update files. The CLI reads them only when
      # `createUpdaterArtifacts` is set, which only the version file above does.
      # The staple of the macOS app. `xcrun stapler` asks the ticket service of Apple
      # (api.apple-cloudkit.com) over HTTP/3, which runs on UDP port 443. On the hosted Mac
      # machines of GitHub that UDP path drops the request (NSURLError -1005, staple error
      # 68; actions/runner-images#14924, open since 2026-10-12), while the same request over
      # TCP works. This step refuses outbound UDP 443 for this job only, so the request goes
      # over HTTPS on TCP, the workaround that GitHub gives in that issue. Tauri staples
      # inside its build call, and the step "Verify the signature of the macOS app"
      # (`stapler validate`) asks the same service, so the rule is set before both.
      - name: Send the requests to Apple over TCP (actions/runner-images#14924)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          echo "block return out quick proto udp from any to any port 443" | sudo pfctl -f -
          sudo pfctl -E
      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHATMAN_RELEASE_REPO: ${{ github.repository }}
          CHATMAN_RELEASE_TAG: ${{ inputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Next-batch plan, N11, item 5: Tauri signs, notarises and staples the `.app` on
          # the macOS legs. APPLE_API_KEY_PATH comes from the step "Write the notarisation
          # key". The Windows leg has no environment, so these values are empty there.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: --target ${{ matrix.triple }} --bundles ${{ matrix.bundles }} --config ${{ runner.temp }}/tauri-version.json
      # Next-batch plan, N11, item 7: the signature of the `.app` (Developer ID of the
      # team, notarisation ticket, Gatekeeper), and the SIGNED Bun binaries inside it start
      # under the hardened runtime (a Bun binary without the JIT entitlement stops).
      - name: Verify the signature of the macOS app
        if: runner.os == 'macOS'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TRIPLE: ${{ matrix.triple }}
        run: bash scripts/verify-macos-signature.sh "src-tauri/target/${TRIPLE}/release/bundle/macos/Prenders.app" "$APPLE_TEAM_ID"
      - name: The signed server inside the app starts
        if: runner.os == 'macOS'
        run: scripts/check-sidecar-starts.sh "src-tauri/target/${{ matrix.triple }}/release/bundle/macos/Prenders.app/Contents/MacOS/chatman"
      - name: The signed keeper inside the app starts
        if: runner.os == 'macOS'
        shell: bash
        run: bun scripts/check-keeper-starts.ts "src-tauri/target/${{ matrix.triple }}/release/bundle/macos/Prenders.app/Contents/MacOS/chatman-keeper"
      - name: Remove the notarisation key
        if: always() && runner.os == 'macOS'
        run: rm -f "${RUNNER_TEMP}/notarisation-key.p8"
      # The bundler gives the macOS update archive the same name on both triples, and
      # `publish` merges all artifacts into one folder, so one file would overwrite the
      # other. The new name has the version and the architecture and no space. A rename
      # does not change the signature, which is over the content.
      - name: Give the macOS update archive the name of its architecture
        if: runner.os == 'macOS'
        shell: bash
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          version=$(jq -r .version build-identity.json)
          case "$TRIPLE" in
            aarch64-apple-darwin) arch=aarch64 ;;
            x86_64-apple-darwin) arch=x64 ;;
            *) echo "bundle: no macOS architecture name for ${TRIPLE}" >&2; exit 1 ;;
          esac
          dir="src-tauri/target/${TRIPLE}/release/bundle/macos"
          archives=("$dir"/*.app.tar.gz)
          if [ "${#archives[@]}" -ne 1 ] || [ ! -f "${archives[0]}.sig" ]; then
            echo "bundle: ${dir} must hold exactly one .app.tar.gz with its .sig; found ${#archives[@]} archive(s)" >&2
            ls -la "$dir" >&2 || true
            exit 1
          fi
          target="${dir}/Prenders_${version}_${arch}.app.tar.gz"
          mv "${archives[0]}" "$target"
          mv "${archives[0]}.sig" "${target}.sig"
          echo "bundle: ${target} and its .sig"
      # The same string that the upload expands, so a changed bundle layout fails here
      # with a sentence, and not as an empty release.
      - name: Refuse unless the upload glob matches something
        shell: bash
        env:
          ARTIFACT_GLOB: ${{ matrix.artifact_glob }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          missing=""
          total=0
          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue
            # shellcheck disable=SC2206
            # Unquoted ON PURPOSE: this line is the glob expansion being asserted.
            matches=($pattern)
            echo "  ${pattern} -> ${#matches[@]}"
            total=$((total + ${#matches[@]}))
            if [ "${#matches[@]}" -eq 0 ]; then
              missing="${missing} ${pattern}"
            fi
          done <<< "$ARTIFACT_GLOB"
          if [ -n "$missing" ]; then
            echo "bundle: the upload glob matches nothing on ${TRIPLE}:${missing}" >&2
            echo "bundle: the release path would be empty; the bundle output layout changed" >&2
            exit 1
          fi
          echo "bundle: ${total} file(s) match the upload glob for ${TRIPLE}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-${{ matrix.triple }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 2

  # Gradle runs here, so this job has no secret except the read-only source key, only
  # `contents: read`, and `persist-credentials: false`. The signing secrets are in
  # `android-sign`, on another runner.
  android:
    name: android
    needs: [resolve, workflow-guards, static-rules, backend, smoke-windows, frontend, python, rust, android-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ANDROID_BUILD_TOOLS_VERSION: 36.0.0
      ANDROID_PLATFORM: android-36
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Write the build identity of the tag
        shell: bash
        env:
          IDENTITY: ${{ needs.resolve.outputs.identity }}
        run: node scripts/build-identity.mjs --from "$IDENTITY"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      # The step "Install backend dependencies for the source scans" below needs Bun. The
      # JVM tests, which also need Bun (row REL2-4, `checkRunDataSafety`), run in
      # `android-test`.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        # The Bun of the build: the workflow env BUN_VERSION.
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Plan-r3 2.2 item 1 (K4): the APK holds the phone page of the web build of this commit.
      # Gradle task `copyPhonePage` copies it from `manager/web/dist` and stops when the
      # identity of that build is not the identity of the APK.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: manager/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: manager/web
        run: npm ci
      # The web build type-checks `backend/tests/helpers/source-scan.ts`, which reads the
      # TypeScript 5 of the backend copy by its path (see the frontend job). Bun is set up above.
      - name: Install backend dependencies for the source scans
        working-directory: backend
        run: bun install --frozen-lockfile
      - name: Build frontend for the APK
        working-directory: manager/web
        env:
          CHATMAN_RELEASE_REPO: ${{ github.repository }}
          CHATMAN_RELEASE_TAG: ${{ inputs.tag }}
        run: npm run build
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      # Design-04 W8 note 2026-11-11, point 2: the one owner of the SDK check is in the source.
      - name: Require the SDK packages
        run: bash scripts/require-android-sdk.sh android
      # The JVM tests and their count run in the test job `android-test`, not here (OD7 of
      # the process rework).
      - name: Build the unsigned release APK
        run: gradle -p android assembleRelease
      - name: Check the package line of the APK
        run: |
          set -euo pipefail
          bash scripts/check-apk-badging.sh android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "$(jq -r .version build-identity.json)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 2

  # The signing secrets are only here, and no Gradle runs here. The sparse checkout holds
  # only the expected digest and the sign script.
  android-sign:
    name: android-sign
    needs: [resolve, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      cert_sha256: ${{ steps.sign.outputs.cert_sha256 }}
    env:
      ANDROID_BUILD_TOOLS_VERSION: 36.0.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            android/release-cert.sha256
            scripts/release-names-cli.mjs
            scripts/release-names.mjs
            scripts/sign-apk.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-unsigned
          path: ${{ runner.temp }}/android-unsigned
      # The secrets go through `env:` to this one step. The script prints the digest as
      # its last line and never prints a secret.
      - name: Sign the APK and check its certificate
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p "${RUNNER_TEMP}/signed"
          # The one owner of the APK name is `release-names.mjs`; its command line is
          # `release-names-cli.mjs`.
          signed="${RUNNER_TEMP}/signed/$(node scripts/release-names-cli.mjs apk "$version")"
          bash scripts/sign-apk.sh "${RUNNER_TEMP}/android-unsigned/app-release-unsigned.apk" "$signed" \
            | tee "${RUNNER_TEMP}/sign.log"
          digest=$(tail -n 1 "${RUNNER_TEMP}/sign.log")
          echo "cert_sha256=${digest}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-android
          path: ${{ runner.temp }}/signed/*.apk
          if-no-files-found: error
          retention-days: 2

  # The release is made here and nowhere else, after every other job. `!cancelled()`: a
  # failed job does not skip this job; the first step names it and refuses.
  publish:
    name: publish
    needs: [resolve, workflow-guards, static-rules, backend, smoke-windows, frontend, python, rust, android-test, bundle, android, android-sign]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      MODE: ${{ inputs.draft && 'draft' || 'release' }}
      SRC_SHA: ${{ needs.resolve.outputs.sha }}
      CERT_SHA256: ${{ needs.android-sign.outputs.cert_sha256 }}
      # Next-batch plan, N9: the count line of the JVM tests that `android-test` printed.
      JVM_TESTS: ${{ needs.android-test.outputs.jvm_tests }}
    steps:
      # The scripts of the release steps, from the source. When `resolve` failed, its
      # output is empty and this is the default branch of the source; the next step
      # then refuses, because `resolve` did not succeed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/check-release-set.sh
            scripts/android-release-notes.sh
            scripts/publish-release.sh
            scripts/release-names-cli.mjs
            scripts/release-names.mjs
            scripts/release-notes.mjs
            scripts/updater-manifest.mjs
            scripts/junit-count.mjs
            scripts/check-android-test-list.mjs
            release-notes/
            test-vectors/release-body-marks.json
          sparse-checkout-cone-mode: false
      - name: Refuse if any job did not succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash scripts/publish-release.sh needs "$TAG"
      # `pattern` + `merge-multiple`: the smoke artefacts must not go into the release.
      - name: Download the bundle artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist
      # Before the list, so that `files.txt` names `dist/latest.json` and the upload sends
      # it. The script reads the folder; the Node of the runner image runs it.
      - name: Write latest.json
        run: node scripts/updater-manifest.mjs write dist "$TAG" "$GH_REPO"
      - name: List the downloaded files
        run: |
          set -euo pipefail
          find dist -type f | sort > "${RUNNER_TEMP}/files.txt"
          echo "Downloaded bundle files:"
          awk '{ printf "  %s\n", $0 } END { printf "  (%d files)\n", NR }' "${RUNNER_TEMP}/files.txt"
      - name: Refuse unless the bundle set is complete
        run: bash scripts/check-release-set.sh files "$TAG" "${RUNNER_TEMP}/files.txt"
      - name: Create the release if it does not exist
        run: bash scripts/publish-release.sh create "$MODE" "$TAG" "${RUNNER_TEMP}/files.txt" "$CERT_SHA256" "$SRC_SHA" "$JVM_TESTS"
      - name: Upload the bundles
        run: bash scripts/publish-release.sh upload "$TAG" "${RUNNER_TEMP}/files.txt"
      - name: Verify the release carries the complete set
        run: bash scripts/publish-release.sh verify "$MODE" "$TAG" dist/latest.json
